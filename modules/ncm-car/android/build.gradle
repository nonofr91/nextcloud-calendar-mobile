plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.ncmcar'
version = '0.1.0'

android {
  namespace "expo.modules.ncmcar"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation "androidx.car.app:app:1.7.0"
  implementation "androidx.car.app:app-automotive:1.7.0"
}
